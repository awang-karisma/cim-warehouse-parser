basePath: /
definitions:
  api.ErrorResponse:
    properties:
      error:
        example: not found
        type: string
    type: object
  api.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  api.ItemsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/model.NormalizedItem'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  api.OrdersResponse:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      orders:
        items:
          $ref: '#/definitions/model.Order'
        type: array
      total:
        type: integer
    type: object
  api.StatusResponse:
    properties:
      error:
        type: string
      is_inside_work_hours:
        type: boolean
      last_duration_ms:
        type: integer
      last_record:
        $ref: '#/definitions/storage.SyncRecord'
      last_sync:
        type: string
      next_sync:
        type: string
      status:
        example: IDLE
        type: string
    type: object
  api.SyncResponse:
    properties:
      message:
        example: sync completed successfully
        type: string
      record:
        $ref: '#/definitions/storage.SyncRecord'
      status:
        example: ok
        type: string
    type: object
  model.NormalizedItem:
    properties:
      area:
        type: string
      belum_terkirim:
        type: string
      catatan:
        type: string
      customer:
        type: string
      jumlah:
        type: string
      jumlah_terkirim:
        type: string
      keterangan:
        type: string
      lead_time_pengiriman:
        type: string
      nama_barang:
        type: string
      row_index:
        type: integer
      satuan:
        type: string
      status_barang:
        type: string
      status_order:
        type: string
      tanggal:
        type: string
      tanggal_pengiriman:
        type: string
    type: object
  model.Order:
    properties:
      area:
        type: string
      customer:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/model.OrderItem'
        type: array
      tanggal:
        type: string
    type: object
  model.OrderItem:
    properties:
      belum_terkirim:
        type: string
      catatan:
        type: string
      jumlah:
        type: string
      jumlah_terkirim:
        type: string
      keterangan:
        type: string
      lead_time_pengiriman:
        type: string
      nama_barang:
        type: string
      row_index:
        type: integer
      satuan:
        type: string
      status_barang:
        type: string
      status_order:
        type: string
      tanggal_pengiriman:
        type: string
    type: object
  storage.Stats:
    properties:
      status_counts:
        additionalProperties:
          type: integer
        type: object
      total_items:
        type: integer
      total_orders:
        type: integer
      unique_areas:
        type: integer
      unique_customers:
        type: integer
    type: object
  storage.SyncRecord:
    properties:
      error_message:
        type: string
      id:
        type: integer
      items_count:
        type: integer
      orders_count:
        type: integer
      status:
        type: string
      synced_at:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Warehouse Engineering
    url: https://github.com/awang-karisma/warehouse-parser
  description: Read-only HTTP REST API server for warehouse order tracking data with
    background Google Sheets synchronization.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Warehouse Order Tracking API
  version: "1.0"
paths:
  /api/v1/items:
    get:
      description: List normalized line items with pagination and filters (customer,
        nama_barang, status_order, date)
      parameters:
      - description: Customer name or substring
        in: query
        name: customer
        type: string
      - description: Item name or substring
        in: query
        name: nama_barang
        type: string
      - description: Order status (e.g. SELESAI, PROSES, PENDING)
        in: query
        name: status_order
        type: string
      - description: Date (e.g. 02/01/2026)
        in: query
        name: date
        type: string
      - description: Number of items to return (default 50, max 1000)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ItemsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List items
      tags:
      - items
  /api/v1/orders:
    get:
      description: List orders with pagination and filters (customer, date, area)
      parameters:
      - description: Customer name or substring
        in: query
        name: customer
        type: string
      - description: Order date (e.g. 02/01/2026)
        in: query
        name: date
        type: string
      - description: Area name or substring
        in: query
        name: area
        type: string
      - description: Number of items to return (default 50, max 1000)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OrdersResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List orders
      tags:
      - orders
  /api/v1/orders/{id}:
    get:
      description: Get a single order by its ID with all line items
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get order by ID
      tags:
      - orders
  /api/v1/stats:
    get:
      description: Get aggregated summary statistics of orders and items
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/storage.Stats'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get stats
      tags:
      - stats
  /api/v1/status:
    get:
      description: Get background worker synchronization status and work hours info
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StatusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get worker status
      tags:
      - worker
  /api/v1/sync:
    post:
      description: Trigger an immediate synchronization from remote data source into
        local storage (force=true)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SyncResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Trigger manual sync
      tags:
      - worker
  /health:
    get:
      description: Check the health and readiness of the API service
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HealthResponse'
      summary: Health check
      tags:
      - system
swagger: "2.0"
