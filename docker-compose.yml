version: '3.8'

services:
  warehouse-server:
    build: .
    container_name: warehouse-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/warehouse.db
      - SYNC_TIMEZONE=Asia/Makassar
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - SPREADSHEET_ID=${SPREADSHEET_ID:-1X3FqpqpP7utvkyFK98YE863ItVsvmmUrBTBsGfuzK3s}
      - SHEET_NAME=${SHEET_NAME:-PESANAN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - SUPERADMIN_EMAILS=${SUPERADMIN_EMAILS:-}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}
      - POSTHOG_SERVICE_NAME=${POSTHOG_SERVICE_NAME:-warehouse-parser-api}
      - POSTHOG_ENVIRONMENT=${POSTHOG_ENVIRONMENT:-production}
      - POSTHOG_LOG_LEVEL=${POSTHOG_LOG_LEVEL:-info}
      - MAP_TILE_CACHE_DIR=${MAP_TILE_CACHE_DIR:-/data/maptiles}
      - MAP_TILE_CACHE_TTL=${MAP_TILE_CACHE_TTL:-720h}
      - MAP_TILE_CACHE_MAX_SIZE_MB=${MAP_TILE_CACHE_MAX_SIZE_MB:-512}
      - MAP_CARTO_API_KEY=${MAP_CARTO_API_KEY:-}
      - MAP_OSM_API_KEY=${MAP_OSM_API_KEY:-}
      - MAP_ESRI_API_KEY=${MAP_ESRI_API_KEY:-}
    volumes:
      - warehouse-data:/data

volumes:
  warehouse-data:
